# lithium-cycle configuration
#
# This file is sourced as a bash script. Keep values simple (no shell tricks).

# Battery device name under /sys/class/power_supply/
BATTERY=BAT0

# Daily threshold (percent). Recommended: 80 for longevity.
NORMAL_THRESHOLD=80

# Threshold during the monthly full-charge window. Usually 100.
FULL_THRESHOLD=100

# Day of the month when the full-charge window opens (1-28).
# The window stays open until capacity reaches COMPLETION_CAPACITY.
FULL_CHARGE_DAY=1

# Capacity (percent) at which the full charge is considered completed.
# Use 100 unless your firmware stops a hair below; in that case, try 99.
COMPLETION_CAPACITY=100
